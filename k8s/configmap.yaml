apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
data:
  AI_PROVIDER: "openai"
  CORS_ORIGIN: "http://taskflow.local"
  JWKS_URL: "http://taskflow-frontend:80/api/auth/jwks"
  # Dapr configuration
  DAPR_HTTP_PORT: "3500"
  DAPR_PUBSUB_NAME: "taskflow-pubsub"
  DAPR_TOPIC: "task-events"
