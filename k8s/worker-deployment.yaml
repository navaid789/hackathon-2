apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-worker
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: taskflow-worker
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "worker"
        dapr.io/app-port: "8001"
        dapr.io/config: "taskflow-tracing"
        dapr.io/log-level: "info"
    spec:
      containers:
        - name: worker
          image: taskflow-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: taskflow-secrets
            - configMapRef:
                name: taskflow-config
          env:
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: DAPR_PUBSUB_NAME
              value: "taskflow-pubsub"
            - name: DAPR_TOPIC
              value: "task-events"
            - name: BACKEND_URL
              value: "http://taskflow-backend:8000"
            - name: OVERDUE_CHECK_INTERVAL
              value: "300"
            - name: DAILY_SUMMARY_HOUR
              value: "8"
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-worker
  namespace: taskflow
spec:
  type: ClusterIP
  selector:
    app: taskflow-worker
  ports:
    - port: 8001
      targetPort: 8001
